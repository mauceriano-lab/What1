<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Pedidos</title>
    <!-- Usamos Tailwind CSS para el diseño sin necesidad de archivos extra -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Iconos para la interfaz -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Estilos base y animaciones suaves */
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f3f4f6; padding-bottom: 80px; }
        .product-card { transition: all 0.3s ease; }
        .product-card:hover { transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        /* Estilo para el input de cantidad */
        .qty-btn { cursor: pointer; user-select: none; }
        .qty-btn:active { transform: scale(0.95); }

        /* Notificación Toast */
        #toast {
            visibility: hidden;
            min-width: 250px;
            background-color: #333;
            color: #fff;
            text-align: center;
            border-radius: 50px;
            padding: 16px;
            position: fixed;
            z-index: 100;
            left: 50%;
            bottom: 30px;
            transform: translateX(-50%);
            font-size: 14px;
            opacity: 0;
            transition: opacity 0.3s, bottom 0.3s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        #toast.show {
            visibility: visible;
            opacity: 1;
            bottom: 100px; /* Se eleva para no tapar el carrito si está visible */
        }
    </style>
</head>
<body class="text-gray-800">

    <!-- Notificación Flotante -->
    <div id="toast">Producto añadido al carrito</div>

    <!-- ENCABEZADO -->
    <header class="bg-white shadow-sm sticky top-0 z-40">
        <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
            <div>
                <h1 id="shop-name-display" class="text-xl font-bold text-green-600">Mi Tienda</h1>
                <p class="text-xs text-gray-500">Catálogo de venta directa</p>
            </div>
            <button onclick="toggleCart()" class="relative p-2 text-gray-600 hover:text-green-600 transition">
                <i data-lucide="shopping-bag"></i>
                <span id="header-cart-count" class="absolute top-0 right-0 bg-red-500 text-white text-xs font-bold rounded-full h-5 w-5 flex items-center justify-center transform scale-0 transition-transform">0</span>
            </button>
        </div>
    </header>

    <!-- LISTA DE PRODUCTOS -->
    <main class="max-w-4xl mx-auto px-4 py-6">
        <!-- Barra de búsqueda simple -->
        <div class="mb-6 relative">
            <input type="text" id="search-input" placeholder="Buscar productos..." class="w-full p-3 pl-10 rounded-lg border border-gray-200 focus:outline-none focus:ring-2 focus:ring-green-500 shadow-sm">
            <i data-lucide="search" class="absolute left-3 top-3.5 text-gray-400 w-5 h-5"></i>
        </div>

        <!-- Grid de Productos -->
        <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
            <!-- Los productos se inyectan aquí con JavaScript -->
        </div>
    </main>

    <!-- BARRA FLOTANTE DEL CARRITO (Sticky Footer) -->
    <div id="sticky-cart-bar" class="fixed bottom-0 left-0 w-full bg-white border-t border-gray-200 shadow-lg z-50 transform translate-y-full transition-transform duration-300">
        <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex flex-col">
                <span class="text-xs text-gray-500">Total estimado</span>
                <span id="sticky-total" class="font-bold text-lg text-green-600">$0.00</span>
            </div>
            <button onclick="toggleCart()" class="bg-green-600 hover:bg-green-700 text-white px-6 py-2 rounded-full font-medium shadow-md flex items-center gap-2 transition">
                Ver Carrito <i data-lucide="arrow-right" class="w-4 h-4"></i>
            </button>
        </div>
    </div>

    <!-- MODAL / PANTALLA DE CARRITO Y CHECKOUT -->
    <div id="cart-modal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden opacity-0 transition-opacity duration-300 backdrop-blur-sm flex justify-end">
        <div class="bg-white w-full max-w-md h-full overflow-y-auto shadow-2xl transform translate-x-full transition-transform duration-300 flex flex-col" id="cart-panel">
            
            <!-- Header del Carrito -->
            <div class="p-4 border-b border-gray-100 flex justify-between items-center bg-white sticky top-0 z-10">
                <h2 class="text-lg font-bold flex items-center gap-2">
                    <i data-lucide="shopping-cart" class="w-5 h-5 text-green-600"></i> Tu Pedido
                </h2>
                <button onclick="toggleCart()" class="p-2 hover:bg-gray-100 rounded-full text-gray-500">
                    <i data-lucide="x" class="w-6 h-6"></i>
                </button>
            </div>

            <!-- Lista de items en carrito -->
            <div class="flex-1 p-4 overflow-y-auto">
                <div id="cart-items-container" class="space-y-4">
                    <!-- Items del carrito -->
                </div>
                
                <div id="empty-cart-msg" class="text-center py-10 text-gray-400 hidden">
                    <i data-lucide="shopping-basket" class="w-16 h-16 mx-auto mb-2 opacity-20"></i>
                    <p>Tu carrito está vacío</p>
                    <button onclick="toggleCart()" class="mt-4 text-green-600 font-medium hover:underline">Volver al catálogo</button>
                </div>
            </div>

            <!-- Formulario de Checkout -->
            <div class="p-4 bg-gray-50 border-t border-gray-200">
                <div class="mb-4 space-y-2">
                    <div class="flex justify-between text-sm">
                        <span class="text-gray-600">Subtotal:</span>
                        <span id="cart-subtotal" class="font-medium">$0.00</span>
                    </div>
                    <div class="flex justify-between text-xl font-bold text-gray-800">
                        <span>Total:</span>
                        <span id="cart-final-total">$0.00</span>
                    </div>
                </div>

                <!-- Formulario -->
                <form id="checkout-form" class="space-y-3 mb-4" onsubmit="event.preventDefault(); sendToWhatsApp();">
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 mb-1 uppercase">Tu Nombre</label>
                        <input type="text" id="customer-name" required class="w-full p-2 rounded border border-gray-300 text-sm focus:ring-2 focus:ring-green-500 focus:border-green-500 outline-none" placeholder="Juan Pérez">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 mb-1 uppercase">Teléfono</label>
                        <input type="tel" id="customer-phone" required class="w-full p-2 rounded border border-gray-300 text-sm focus:ring-2 focus:ring-green-500 focus:border-green-500 outline-none" placeholder="Tu número">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 mb-1 uppercase">Dirección de Entrega</label>
                        <textarea id="customer-address" required rows="2" class="w-full p-2 rounded border border-gray-300 text-sm focus:ring-2 focus:ring-green-500 focus:border-green-500 outline-none" placeholder="Calle, Número, Ciudad..."></textarea>
                    </div>
                    
                    <button type="submit" class="w-full bg-green-600 text-white py-3 rounded-lg font-bold shadow hover:bg-green-700 transition flex justify-center items-center gap-2">
                        <i data-lucide="message-circle" class="w-5 h-5"></i>
                        Enviar Pedido por WhatsApp
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- JAVASCRIPT: LÓGICA DE LA TIENDA -->
    <script>
        /**
         * ==========================================
         * ZONA DE CONFIGURACIÓN - EDITA AQUÍ
         * ==========================================
         */
        
        const STORE_CONFIG = {
            name: "Boutique Online", // Nombre de tu tienda
            currency: "$",           // Símbolo de moneda (ej: $, €, S/.)
            whatsappNumber: "1234567890", // TU NÚMERO DE WHATSAPP (con código de país, sin +)
            countryCode: "1"        // Código de país opcional si no lo pones arriba
        };

        // LISTA DE PRODUCTOS
        // Para agregar productos, copia y pega un bloque {} y cambia los datos.
        // Las imagenes pueden ser enlaces de internet.
        const products = [
            {
                id: 1,
                name: "Camiseta Premium Blanca",
                price: 25.00,
                description: "Algodón 100%, corte moderno y fresco.",
                image: "https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?auto=format&fit=crop&w=500&q=80",
                category: "Ropa"
            },
            {
                id: 2,
                name: "Zapatillas Urbanas",
                price: 55.50,
                description: "Diseño ergonómico ideal para caminar todo el día.",
                image: "https://images.unsplash.com/photo-1552346154-21d32810aba3?auto=format&fit=crop&w=500&q=80",
                category: "Calzado"
            },
            {
                id: 3,
                name: "Gorra Clásica",
                price: 15.00,
                description: "Ajustable, visera curva, varios colores.",
                image: "https://images.unsplash.com/photo-1588850561407-ed78c282e89b?auto=format&fit=crop&w=500&q=80",
                category: "Accesorios"
            },
            {
                id: 4,
                name: "Mochila de Viaje",
                price: 45.00,
                description: "Impermeable con compartimento para laptop.",
                image: "https://images.unsplash.com/photo-1553062407-98eeb64c6a62?auto=format&fit=crop&w=500&q=80",
                category: "Accesorios"
            },
            {
                id: 5,
                name: "Reloj Minimalista",
                price: 89.99,
                description: "Correa de cuero genuino y maquinaria de cuarzo.",
                image: "https://images.unsplash.com/photo-1524592094714-0f0654e20314?auto=format&fit=crop&w=500&q=80",
                category: "Accesorios"
            },
            {
                id: 6,
                name: "Gafas de Sol",
                price: 30.00,
                description: "Protección UV400, marco ligero.",
                image: "https://images.unsplash.com/photo-1572635196237-14b3f281503f?auto=format&fit=crop&w=500&q=80",
                category: "Accesorios"
            },
            {
                id: 7,
                name: "Auriculares Bluetooth",
                price: 35.00,
                description: "Sonido HD con cancelación de ruido pasiva.",
                image: "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=500&q=80",
                category: "Tecnología"
            },
            {
                id: 8,
                name: "Botella Térmica",
                price: 18.50,
                description: "Mantiene bebidas frías por 24h y calientes por 12h.",
                image: "https://images.unsplash.com/photo-1536939459926-301728717817?auto=format&fit=crop&w=500&q=80",
                category: "Hogar"
            },
            {
                id: 9,
                name: "Funda para Laptop",
                price: 22.00,
                description: "Acolchada, resistente al agua, para 13-15 pulgadas.",
                image: "https://images.unsplash.com/photo-1603302576837-37561b2e2302?auto=format&fit=crop&w=500&q=80",
                category: "Tecnología"
            }
        ];

        /**
         * ==========================================
         * FIN DE LA ZONA DE CONFIGURACIÓN
         * (No necesitas editar mucho abajo de aquí)
         * ==========================================
         */

        // Estado del carrito
        let cart = {}; 

        // Inicialización
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('shop-name-display').textContent = STORE_CONFIG.name;
            renderProducts(products);
            lucide.createIcons();
            
            // Búsqueda en tiempo real
            document.getElementById('search-input').addEventListener('input', (e) => {
                const term = e.target.value.toLowerCase();
                const filtered = products.filter(p => 
                    p.name.toLowerCase().includes(term) || 
                    p.description.toLowerCase().includes(term)
                );
                renderProducts(filtered);
            });
        });

        // Renderizar catálogo
        function renderProducts(productList) {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = '';

            productList.forEach(product => {
                const card = document.createElement('div');
                card.className = 'product-card bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden flex flex-col fade-in';
                
                card.innerHTML = `
                    <div class="h-48 overflow-hidden relative group">
                        <img src="${product.image}" alt="${product.name}" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110">
                    </div>
                    <div class="p-4 flex flex-col flex-1">
                        <div class="flex-1">
                            <h3 class="font-bold text-gray-800 text-lg leading-tight mb-1">${product.name}</h3>
                            <p class="text-sm text-gray-500 line-clamp-2 mb-3">${product.description}</p>
                        </div>
                        
                        <!-- Precio -->
                        <div class="mb-3">
                            <span class="text-xl font-bold text-green-600">${STORE_CONFIG.currency}${product.price.toFixed(2)}</span>
                        </div>

                        <!-- Controles de Añadir (Botón + Selector Cantidad) -->
                        <div class="flex items-center gap-2">
                            <div class="flex items-center border border-gray-200 rounded-lg h-10">
                                <button onclick="adjustLocalQty(${product.id}, -1)" class="w-8 h-full flex items-center justify-center bg-gray-50 hover:bg-gray-100 rounded-l-lg text-gray-600 transition">
                                    <i data-lucide="minus" class="w-4 h-4"></i>
                                </button>
                                <input id="qty-input-${product.id}" type="number" value="1" min="1" class="w-10 h-full text-center border-x border-gray-200 text-sm focus:outline-none text-gray-700 font-medium" readonly>
                                <button onclick="adjustLocalQty(${product.id}, 1)" class="w-8 h-full flex items-center justify-center bg-gray-50 hover:bg-gray-100 rounded-r-lg text-gray-600 transition">
                                    <i data-lucide="plus" class="w-4 h-4"></i>
                                </button>
                            </div>
                            
                            <button onclick="addToCart(${product.id})" class="bg-green-600 hover:bg-green-700 text-white h-10 px-4 rounded-lg font-bold flex-1 flex items-center justify-center gap-2 transition shadow-sm active:scale-95">
                                Añadir <i data-lucide="shopping-cart" class="w-4 h-4"></i>
                            </button>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
            lucide.createIcons();
        }

        // Ajustar cantidad local en la tarjeta (antes de añadir al carrito)
        function adjustLocalQty(productId, change) {
            const input = document.getElementById(`qty-input-${productId}`);
            let newVal = parseInt(input.value) + change;
            if (newVal < 1) newVal = 1;
            input.value = newVal;
        }

        // Añadir al Carrito (Acción del botón)
        function addToCart(productId) {
            const input = document.getElementById(`qty-input-${productId}`);
            const qtyToAdd = parseInt(input.value);
            const product = products.find(p => p.id === productId);

            if (!cart[productId]) {
                cart[productId] = { ...product, qty: qtyToAdd };
            } else {
                cart[productId].qty += qtyToAdd;
            }

            // Resetear input a 1 visualmente
            input.value = 1;
            
            // Actualizar UI general
            updateUI(productId);
            
            // Mostrar confirmación
            showToast(`¡${qtyToAdd}x ${product.name} añadido!`);
        }

        // Mostrar notificación Toast
        function showToast(message) {
            const toast = document.getElementById("toast");
            toast.textContent = message;
            toast.className = "show";
            setTimeout(function(){ toast.className = toast.className.replace("show", ""); }, 3000);
        }

        // Actualizar Cantidad (Usado solo dentro del MODAL del carrito ahora)
        function updateQty(productId, change) {
            if (!cart[productId]) return;

            // Modificamos cantidad
            cart[productId].qty += change;
            
            // Si llega a 0, lo eliminamos
            if (cart[productId].qty <= 0) {
                delete cart[productId];
            }
            
            updateUI(productId);
        }

        // Actualizar Interfaz Global
        function updateUI(productId) {
            // Nota: Ya no actualizamos contadores en las tarjetas porque ahora son estáticos
            // Solo actualizamos totales y carrito

            // 2. Calcular totales
            let totalItems = 0;
            let totalPrice = 0;
            
            Object.values(cart).forEach(item => {
                totalItems += item.qty;
                totalPrice += item.qty * item.price;
            });

            // 3. Actualizar Badges y Totales
            const badge = document.getElementById('header-cart-count');
            badge.textContent = totalItems;
            
            if (totalItems > 0) {
                badge.classList.remove('scale-0');
                document.getElementById('sticky-cart-bar').classList.remove('translate-y-full');
            } else {
                badge.classList.add('scale-0');
                document.getElementById('sticky-cart-bar').classList.add('translate-y-full');
            }

            document.getElementById('sticky-total').textContent = `${STORE_CONFIG.currency}${totalPrice.toFixed(2)}`;
            document.getElementById('cart-final-total').textContent = `${STORE_CONFIG.currency}${totalPrice.toFixed(2)}`;
            document.getElementById('cart-subtotal').textContent = `${STORE_CONFIG.currency}${totalPrice.toFixed(2)}`;

            // 4. Si el carrito está abierto, refrescar la lista
            renderCartItems();
        }

        // Renderizar lista dentro del Modal del Carrito
        function renderCartItems() {
            const container = document.getElementById('cart-items-container');
            const emptyMsg = document.getElementById('empty-cart-msg');
            const items = Object.values(cart);

            container.innerHTML = '';

            if (items.length === 0) {
                emptyMsg.classList.remove('hidden');
                return;
            } else {
                emptyMsg.classList.add('hidden');
            }

            items.forEach(item => {
                const row = document.createElement('div');
                row.className = 'flex gap-4 items-center bg-white p-2 rounded-lg border border-gray-100';
                row.innerHTML = `
                    <img src="${item.image}" class="w-16 h-16 object-cover rounded-md bg-gray-100">
                    <div class="flex-1">
                        <h4 class="font-bold text-sm text-gray-800">${item.name}</h4>
                        <div class="text-green-600 font-semibold text-sm">${STORE_CONFIG.currency}${(item.price * item.qty).toFixed(2)}</div>
                    </div>
                    <div class="flex flex-col items-center gap-1">
                        <div class="flex items-center bg-gray-50 rounded p-0.5">
                            <button onclick="updateQty(${item.id}, -1)" class="w-6 h-6 flex items-center justify-center bg-white border border-gray-200 rounded text-gray-600 hover:text-red-500">
                                <i data-lucide="minus" class="w-3 h-3"></i>
                            </button>
                            <span class="w-6 text-center text-xs font-bold">${item.qty}</span>
                            <button onclick="updateQty(${item.id}, 1)" class="w-6 h-6 flex items-center justify-center bg-white border border-gray-200 rounded text-gray-600 hover:text-green-600">
                                <i data-lucide="plus" class="w-3 h-3"></i>
                            </button>
                        </div>
                    </div>
                `;
                container.appendChild(row);
            });
            lucide.createIcons();
        }

        // Abrir/Cerrar Carrito
        function toggleCart() {
            const modal = document.getElementById('cart-modal');
            const panel = document.getElementById('cart-panel');
            
            if (modal.classList.contains('hidden')) {
                // Abrir
                renderCartItems();
                modal.classList.remove('hidden');
                // Timeout pequeño para permitir que la clase hidden se quite antes de animar opacidad
                setTimeout(() => {
                    modal.classList.remove('opacity-0');
                    panel.classList.remove('translate-x-full');
                }, 10);
                document.body.style.overflow = 'hidden'; // Evitar scroll de fondo
            } else {
                // Cerrar
                modal.classList.add('opacity-0');
                panel.classList.add('translate-x-full');
                setTimeout(() => {
                    modal.classList.add('hidden');
                    document.body.style.overflow = '';
                }, 300);
            }
        }

        // Generar y enviar mensaje a WhatsApp
        function sendToWhatsApp() {
            const name = document.getElementById('customer-name').value;
            const phone = document.getElementById('customer-phone').value;
            const address = document.getElementById('customer-address').value;
            
            if (!name || !phone || !address) {
                alert("Por favor completa todos los datos para el envío.");
                return;
            }

            const items = Object.values(cart);
            if (items.length === 0) {
                alert("El carrito está vacío.");
                return;
            }

            let message = `*NUEVO PEDIDO - ${STORE_CONFIG.name}*\n\n`;
            message += `*Cliente:* ${name}\n`;
            message += `*Tel:* ${phone}\n`;
            message += `*Dirección:* ${address}\n\n`;
            message += `*DETALLE DEL PEDIDO:*\n`;
            
            let total = 0;
            items.forEach(item => {
                const subtotal = item.qty * item.price;
                total += subtotal;
                message += `▪ ${item.qty}x ${item.name} (${STORE_CONFIG.currency}${subtotal.toFixed(2)})\n`;
            });

            message += `\n*TOTAL A PAGAR: ${STORE_CONFIG.currency}${total.toFixed(2)}*`;

            // Codificar mensaje para URL
            const encodedMessage = encodeURIComponent(message);
            const fullPhone = STORE_CONFIG.countryCode ? STORE_CONFIG.countryCode + STORE_CONFIG.whatsappNumber : STORE_CONFIG.whatsappNumber;
            
            const whatsappUrl = `https://wa.me/${fullPhone}?text=${encodedMessage}`;
            
            window.open(whatsappUrl, '_blank');
        }
    </script>
</body>
</html>
