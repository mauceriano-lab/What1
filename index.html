<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo Dinámico</title>
    
    <!-- Librería para leer CSV (Excel) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Iconos Lucide -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Fuente Montserrat -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Configuración Dinámica de Tailwind -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Montserrat', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            light: 'var(--color-brand-light)',
                            DEFAULT: 'var(--color-brand-main)',
                            dark: 'var(--color-brand-dark)',
                        },
                        accent: 'var(--color-accent)',
                    }
                }
            }
        }
    </script>

    <style>
        :root {
            /* Valores por defecto */
            --color-brand-light: #94a3b8; /* Slate 400 */
            --color-brand-main: #475569;  /* Slate 600 */
            --color-brand-dark: #1e293b;  /* Slate 800 */
            --color-accent: #0ea5e9;      /* Sky 500 */
            --bg-color: #f8fafc;
        }

        body { 
            background-color: var(--bg-color);
            padding-bottom: 100px;
        }
        
        .card-enter { animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .btn-dynamic {
            background-color: var(--color-brand-dark);
            color: white;
            transition: all 0.2s ease;
        }
        .btn-dynamic:hover {
            background-color: var(--color-accent);
            transform: translateY(-1px);
        }
        .btn-dynamic:active { transform: scale(0.98); }

        .glass-bar {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(12px);
            border-top: 1px solid rgba(0,0,0, 0.05);
        }

        /* Scroll horizontal oculto para categorías */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Estilo botones categoría - Minimalista */
        .cat-btn {
            position: relative;
        }
        .cat-btn.active {
            color: var(--color-brand-dark);
            font-weight: 700;
        }
        .cat-btn.active::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 3px;
            background-color: var(--color-accent);
            border-radius: 99px;
        }

        #toast {
            visibility: hidden;
            min-width: 280px;
            background: #1e293b;
            color: #fff;
            border-radius: 8px;
            padding: 16px;
            position: fixed;
            z-index: 100;
            left: 50%;
            bottom: 30px;
            transform: translateX(-50%) translateY(20px);
            opacity: 0;
            transition: all 0.4s;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-weight: 500;
        }
        #toast.show { visibility: visible; opacity: 1; transform: translateX(-50%) translateY(0); bottom: 110px; }

        .loader-overlay {
            position: fixed; inset: 0; background: #f8fafc; z-index: 9999;
            display: flex; justify-content: center; align-items: center; flex-direction: column;
            transition: opacity 0.5s;
        }
    </style>
</head>
<body class="text-slate-700 antialiased">

    <!-- Pantalla de Carga -->
    <div id="loader" class="loader-overlay">
        <div class="animate-spin rounded-full h-10 w-10 border-t-2 border-b-2 border-slate-800 mb-4"></div>
        <p class="text-slate-500 text-xs tracking-widest uppercase font-semibold">Cargando...</p>
    </div>

    <!-- Toast -->
    <div id="toast">
        <i data-lucide="check" class="w-5 h-5 text-emerald-400"></i>
        <span id="toast-msg">Acción realizada</span>
    </div>

    <!-- HEADER - Estilo Limpio/Directorio -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30">
        <div class="max-w-5xl mx-auto px-6 py-4">
            <div class="flex justify-between items-center gap-4">
                <div class="flex-1">
                    <h1 id="shop-name" class="text-xl font-bold tracking-tight text-slate-900">Servicios</h1>
                    <p id="shop-desc" class="text-slate-400 text-xs hidden sm:block">Catálogo</p>
                </div>

                <!-- Buscador Compacto -->
                <div class="relative w-full max-w-xs hidden md:block">
                    <input type="text" id="search-input-desktop" placeholder="Buscar servicios..." class="w-full py-2 pl-9 pr-4 rounded-full bg-slate-100 border-none text-sm text-slate-800 focus:ring-2 focus:ring-accent transition">
                    <i data-lucide="search" class="absolute left-3 top-2.5 text-slate-400 w-4 h-4"></i>
                </div>
                
                <button onclick="toggleCart()" class="relative p-2 rounded-full hover:bg-slate-100 transition group">
                    <i data-lucide="clipboard-list" class="text-slate-600 w-6 h-6"></i>
                    <span id="cart-count" class="absolute -top-1 -right-1 bg-accent text-white text-[10px] font-bold rounded-full h-5 min-w-[20px] px-1 flex items-center justify-center transform scale-0 transition-transform">0</span>
                </button>
            </div>
            
            <!-- Buscador Móvil -->
            <div class="mt-4 md:hidden relative">
                 <input type="text" id="search-input-mobile" placeholder="Buscar..." class="w-full py-2 pl-9 pr-4 rounded-lg bg-slate-100 border-none text-sm text-slate-800 focus:ring-2 focus:ring-accent transition">
                 <i data-lucide="search" class="absolute left-3 top-2.5 text-slate-400 w-4 h-4"></i>
            </div>

            <!-- Categorías (Tabs Minimalistas) -->
            <div class="mt-4 overflow-hidden border-t border-slate-100 pt-1">
                <div id="category-container" class="flex gap-6 overflow-x-auto no-scrollbar py-3">
                    <!-- Se rellena con JS -->
                    <button class="cat-btn active whitespace-nowrap text-sm font-medium transition text-slate-500 hover:text-slate-800" onclick="filterByCategory('all', this)">
                        Todo
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- LISTA DE PRODUCTOS (Diseño Directorio) -->
    <main class="max-w-5xl mx-auto px-4 py-8 relative z-20 pb-20">
        <div id="product-grid" class="flex flex-col gap-6">
            <!-- Renderizado JS -->
        </div>
    </main>

    <!-- STICKY FOOTER -->
    <div id="sticky-bar" class="fixed bottom-0 left-0 w-full glass-bar shadow-[0_-4px_20px_rgba(0,0,0,0.05)] z-40 transform translate-y-full transition-transform duration-500">
        <div class="max-w-5xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex flex-col">
                <span class="text-[10px] uppercase text-slate-400 font-bold tracking-wider">Total Estimado</span>
                <span id="sticky-total" class="font-bold text-xl text-slate-900">0.00</span>
            </div>
            <button onclick="toggleCart()" class="btn-dynamic px-6 py-3 rounded-lg font-bold shadow-lg flex items-center gap-2 text-sm">
                Solicitar Cita <i data-lucide="arrow-right" class="w-4 h-4"></i>
            </button>
        </div>
    </div>

    <!-- MODAL CARRITO -->
    <div id="cart-modal" class="fixed inset-0 bg-slate-900/40 z-50 hidden opacity-0 transition-opacity duration-300 backdrop-blur-sm flex justify-end">
        <div class="bg-white w-full max-w-md h-full shadow-2xl transform translate-x-full transition-transform duration-300 flex flex-col" id="cart-panel">
            
            <div class="px-6 py-5 border-b border-slate-100 flex justify-between items-center bg-white">
                <div>
                    <h2 class="text-lg font-bold text-slate-900">Resumen de Solicitud</h2>
                    <p class="text-xs text-slate-500 mt-0.5">Revisa los servicios seleccionados</p>
                </div>
                <button onclick="toggleCart()" class="p-2 hover:bg-slate-100 rounded-full text-slate-500 transition">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <div class="flex-1 p-6 overflow-y-auto bg-slate-50/50">
                <div id="cart-items" class="space-y-4"></div>
                <div id="empty-msg" class="text-center py-20 hidden">
                    <div class="bg-slate-100 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-3">
                        <i data-lucide="clipboard" class="w-8 h-8 text-slate-300"></i>
                    </div>
                    <p class="text-slate-500 font-medium">No has seleccionado servicios</p>
                </div>
            </div>

            <div class="p-6 bg-white border-t border-slate-100 shadow-[0_-5px_20px_rgba(0,0,0,0.03)]">
                <div class="flex justify-between text-xl font-bold text-slate-900 mb-6">
                    <span>Total</span>
                    <span id="cart-final-total">0.00</span>
                </div>

                <form id="checkout-form" class="space-y-4" onsubmit="event.preventDefault(); sendWhatsApp();">
                    <div class="space-y-3">
                        <input type="text" id="cust-name" required class="w-full px-4 py-3 rounded-lg border border-slate-200 bg-white focus:border-accent focus:ring-1 focus:ring-accent outline-none text-sm transition" placeholder="Tu Nombre Completo">
                        <input type="tel" id="cust-phone" required class="w-full px-4 py-3 rounded-lg border border-slate-200 bg-white focus:border-accent focus:ring-1 focus:ring-accent outline-none text-sm transition" placeholder="Teléfono de Contacto">
                        <textarea id="cust-note" required rows="2" class="w-full px-4 py-3 rounded-lg border border-slate-200 bg-white focus:border-accent focus:ring-1 focus:ring-accent outline-none resize-none text-sm transition" placeholder="Dirección y detalles de la cita..."></textarea>
                    </div>
                    
                    <button type="submit" class="w-full btn-dynamic py-4 rounded-lg font-bold shadow-lg flex justify-center gap-2 group">
                        Confirmar por WhatsApp 
                        <i data-lucide="send" class="w-4 h-4 group-hover:translate-x-1 transition-transform"></i>
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- LOGICA JAVASCRIPT -->
    <script>
        // --- DATOS DEL CSV CON VARIANTES NUEVAS ---
        const csvData = `
Seccion,Clave_Categoria,Valor_Nombre,Descripcion,Precio,Variantes,Imagen
CONFIG,nombre_tienda,Servicios Profesionales,,0,,
CONFIG,descripcion_tienda,Expertos a tu disposición,,0,,
CONFIG,telefono,1234567890,,0,,
CONFIG,prefijo_pais,1,,0,,
CONFIG,moneda,$,,0,,
CONFIG,color_principal,#475569,,0,,
CONFIG,color_secundario,#1e293b,,0,,
CONFIG,color_acento,#0ea5e9,,0,,
PRODUCTO,Hogar,Fontanería Express,Reparación rápida de fugas y grifería.,55,"Urgente,Estándar,Revisión",https://images.unsplash.com/photo-1607472586893-edb57bdc0e39?auto=format&fit=crop&w=500&q=80
PRODUCTO,Técnico,Mantenimiento AC,Servicio completo de limpieza y carga de gas.,60,"Split Pared,Cassette Techo,Centralizado",https://images.unsplash.com/photo-1621905251189-08b45d6a269e?auto=format&fit=crop&w=500&q=80
PRODUCTO,Bienestar,Masaje Terapéutico,Sesión personalizada de relajación profunda.,45,"Aceite Lavanda,Aceite Romero,Descontracturante",https://images.unsplash.com/photo-1600334089648-b0d9d3028eb2?auto=format&fit=crop&w=500&q=80
PRODUCTO,Salud,Clase de Yoga,Instrucción profesional para cuerpo y mente.,15,"Hatha,Vinyasa,Restaurativo",https://images.unsplash.com/photo-1599901860904-17e6ed7083a0?auto=format&fit=crop&w=500&q=80
PRODUCTO,Hogar,Jardinería,Cuidado integral de zonas verdes.,25,"/hora",https://images.unsplash.com/photo-1558904541-efa843a96f01?auto=format&fit=crop&w=500&q=80
PRODUCTO,Profesional,Asesoría Legal,Consultoría experta para tus necesidades legales.,80,"Civil,Laboral,Mercantil",https://images.unsplash.com/photo-1589829085413-56de8ae18c73?auto=format&fit=crop&w=500&q=80
PRODUCTO,Diseño,Diseño de Identidad,Creación de logotipos y papelería corporativa.,150,"Estilo Minimalista,Estilo Vintage,Estilo Moderno",https://images.unsplash.com/photo-1611162617474-5b21e879e113?auto=format&fit=crop&w=500&q=80
PRODUCTO,Técnico,Soporte Informático,Diagnóstico y reparación de equipos.,30,"PC Sobremesa,Laptop,Mac",https://images.unsplash.com/photo-1550751827-4bd374c3f58b?auto=format&fit=crop&w=500&q=80
PRODUCTO,Eventos,Fotografía Pro,Cobertura de eventos y sesiones privadas.,120,"Retrato,Evento Social,Corporativo",https://images.unsplash.com/photo-1516035069371-29a1b244cc32?auto=format&fit=crop&w=500&q=80
`.trim();

        // --- VARIABLES GLOBALES ---
        let CONFIG = {
            storeName: "Tienda",
            desc: "Catálogo",
            phone: "",
            prefix: "1",
            currency: "$",
            colors: { main: '#475569', dark: '#1e293b', accent: '#0ea5e9' }
        };
        let PRODUCTS = [];
        let CART = {};
        let currentCategory = 'all';

        // --- INICIALIZACIÓN ---
        document.addEventListener('DOMContentLoaded', () => {
            loadData();
            // Vinculamos ambos buscadores (movil y desktop)
            const handleSearch = (e) => {
                const val = e.target.value;
                document.getElementById('search-input-desktop').value = val;
                document.getElementById('search-input-mobile').value = val;
                renderProducts();
            };
            document.getElementById('search-input-desktop').addEventListener('input', handleSearch);
            document.getElementById('search-input-mobile').addEventListener('input', handleSearch);
        });

        // --- CARGA DE DATOS ---
        function loadData() {
            Papa.parse(csvData, {
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    processData(results.data);
                    document.getElementById('loader').style.opacity = '0';
                    setTimeout(() => document.getElementById('loader').remove(), 500);
                }
            });
        }

        function processData(rows) {
            const categories = new Set();
            
            rows.forEach(row => {
                const section = row.Seccion ? row.Seccion.trim().toUpperCase() : '';
                
                if (section === 'CONFIG') {
                    const key = row.Clave_Categoria.toLowerCase().trim();
                    const val = row.Valor_Nombre;
                    
                    if (key === 'nombre_tienda') CONFIG.storeName = val;
                    if (key === 'descripcion_tienda') CONFIG.desc = val;
                    if (key === 'telefono') CONFIG.phone = val;
                    if (key === 'prefijo_pais') CONFIG.prefix = val;
                    if (key === 'moneda') CONFIG.currency = val;
                    if (key === 'color_principal') CONFIG.colors.main = val;
                    if (key === 'color_secundario') CONFIG.colors.dark = val;
                    if (key === 'color_acento') CONFIG.colors.accent = val;

                } else if (section === 'PRODUCTO') {
                    PRODUCTS.push({
                        id: PRODUCTS.length + 1,
                        category: row.Clave_Categoria,
                        name: row.Valor_Nombre,
                        desc: row.Descripcion,
                        price: parseFloat(row.Precio) || 0,
                        variants: row.Variantes ? row.Variantes.split(',').map(v => v.trim()) : [],
                        image: row.Imagen || 'https://via.placeholder.com/400x300?text=No+Image'
                    });
                    categories.add(row.Clave_Categoria);
                }
            });

            applyConfig();
            renderCategoryButtons(Array.from(categories));
            renderProducts();
        }

        function applyConfig() {
            document.getElementById('shop-name').textContent = CONFIG.storeName;
            document.getElementById('shop-desc').textContent = CONFIG.desc;
            document.title = CONFIG.storeName;

            const root = document.documentElement;
            root.style.setProperty('--color-brand-main', CONFIG.colors.main);
            root.style.setProperty('--color-brand-dark', CONFIG.colors.dark);
            root.style.setProperty('--color-accent', CONFIG.colors.accent);
            root.style.setProperty('--color-brand-light', CONFIG.colors.main); 
        }

        function renderCategoryButtons(cats) {
            const container = document.getElementById('category-container');
            container.innerHTML = `
                <button class="cat-btn active whitespace-nowrap text-sm font-medium transition text-slate-800" onclick="filterByCategory('all', this)">
                    Todo
                </button>
            `;
            
            cats.forEach(c => {
                const btn = document.createElement('button');
                btn.className = `cat-btn whitespace-nowrap text-sm font-medium transition text-slate-500 hover:text-slate-800`;
                btn.textContent = c;
                btn.onclick = () => filterByCategory(c, btn);
                container.appendChild(btn);
            });
        }

        function filterByCategory(cat, btnElement) {
            currentCategory = cat;
            
            // Reset active states
            document.querySelectorAll('.cat-btn').forEach(b => {
                b.classList.remove('active', 'text-slate-800');
                b.classList.add('text-slate-500');
            });
            
            btnElement.classList.remove('text-slate-500');
            btnElement.classList.add('active', 'text-slate-800');
            
            renderProducts();
        }

        // --- RENDERIZADO TIPO LISTA ---
        function renderProducts() {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = '';
            
            const searchTerm = document.getElementById('search-input-desktop').value.toLowerCase();

            const filtered = PRODUCTS.filter(p => {
                const matchSearch = p.name.toLowerCase().includes(searchTerm) || p.desc.toLowerCase().includes(searchTerm);
                const matchCat = currentCategory === 'all' || p.category === currentCategory;
                return matchSearch && matchCat;
            });

            filtered.forEach((p, index) => {
                const hasVariants = p.variants.length > 0;
                let variantsHTML = '';
                let unitLabel = '';

                // Detectar si es unidad simple (/hora) o variante real
                if (hasVariants && p.variants.length === 1 && p.variants[0].startsWith('/')) {
                    unitLabel = `<span class="text-xs text-slate-400 font-normal ml-1">${p.variants[0]}</span>`;
                } else if (hasVariants) {
                    variantsHTML = `
                        <div class="mt-3">
                            <select id="var-select-${p.id}" class="w-full sm:w-auto bg-slate-50 border border-slate-200 text-slate-700 text-sm rounded-lg focus:ring-accent focus:border-accent block p-2 outline-none cursor-pointer hover:bg-white transition">
                                ${p.variants.map(v => `<option value="${v}">${v}</option>`).join('')}
                            </select>
                        </div>
                    `;
                }

                const card = document.createElement('div');
                // CAMBIO PRINCIPAL: Flex row en desktop, imagen izquierda
                card.className = 'card-enter bg-white rounded-xl border border-slate-100 shadow-sm overflow-hidden flex flex-col sm:flex-row hover:border-slate-300 transition-colors duration-300';
                card.style.animationDelay = `${index * 50}ms`;
                
                card.innerHTML = `
                    <!-- Imagen lateral en desktop, superior en movil -->
                    <div class="sm:w-48 h-48 sm:h-auto flex-shrink-0 relative overflow-hidden bg-slate-100">
                        <img src="${p.image}" class="w-full h-full object-cover transition-transform duration-500 hover:scale-105">
                        <span class="absolute top-2 left-2 bg-white/90 backdrop-blur text-slate-800 text-[10px] font-bold px-2 py-0.5 rounded shadow-sm sm:hidden">
                            ${p.category}
                        </span>
                    </div>
                    
                    <!-- Contenido -->
                    <div class="p-5 flex flex-col flex-1 justify-between">
                        <div>
                            <div class="flex justify-between items-start mb-1">
                                <div>
                                    <span class="hidden sm:inline-block text-[10px] font-bold tracking-wider text-accent uppercase mb-1">${p.category}</span>
                                    <h3 class="font-bold text-slate-900 text-lg">${p.name}</h3>
                                </div>
                                <div class="text-right">
                                    <span class="text-lg font-bold text-slate-900">${CONFIG.currency}${p.price}</span>
                                    ${unitLabel}
                                </div>
                            </div>
                            <p class="text-sm text-slate-500 leading-relaxed max-w-2xl">${p.desc}</p>
                            ${variantsHTML}
                        </div>
                        
                        <!-- Controles alineados a la derecha/abajo -->
                        <div class="flex items-center justify-end gap-4 mt-5 pt-4 border-t border-slate-50">
                             <div class="flex items-center bg-slate-50 rounded-lg h-9 border border-slate-200">
                                <button onclick="adjustTempQty(${p.id}, -1)" class="w-8 h-full flex items-center justify-center text-slate-400 hover:text-slate-800 hover:bg-slate-100 rounded-l-lg transition"><i data-lucide="minus" class="w-3 h-3"></i></button>
                                <input id="qty-${p.id}" value="1" readonly class="w-8 text-center bg-transparent text-sm font-semibold text-slate-700 outline-none border-x border-slate-100 h-full">
                                <button onclick="adjustTempQty(${p.id}, 1)" class="w-8 h-full flex items-center justify-center text-slate-400 hover:text-slate-800 hover:bg-slate-100 rounded-r-lg transition"><i data-lucide="plus" class="w-3 h-3"></i></button>
                            </div>
                            
                            <button onclick="addToCart(${p.id})" class="bg-slate-900 hover:bg-accent text-white h-9 px-5 rounded-lg text-sm font-medium transition-colors shadow-sm flex items-center gap-2">
                                <span>Añadir</span>
                                <i data-lucide="plus" class="w-3 h-3"></i>
                            </button>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
            lucide.createIcons();
        }

        function adjustTempQty(id, change) {
            const el = document.getElementById(`qty-${id}`);
            let val = parseInt(el.value) + change;
            if(val < 1) val = 1;
            el.value = val;
        }

        // --- LÓGICA DEL CARRITO (Igual que antes) ---
        function addToCart(id) {
            const product = PRODUCTS.find(p => p.id === id);
            const qty = parseInt(document.getElementById(`qty-${id}`).value);
            
            let variant = null;
            const varSelect = document.getElementById(`var-select-${id}`);
            
            if (varSelect) {
                variant = varSelect.value;
            } else if (product.variants.length > 0) {
                variant = product.variants[0];
            }

            const cartKey = variant ? `${id}-${variant}` : `${id}`;

            if (CART[cartKey]) {
                CART[cartKey].qty += qty;
            } else {
                CART[cartKey] = {
                    ...product,
                    qty: qty,
                    selectedVariant: variant,
                    cartKey: cartKey 
                };
            }

            document.getElementById(`qty-${id}`).value = 1;
            updateCartUI();
            showToast(`Añadido: ${product.name}`);
        }

        function updateCartUI() {
            const items = Object.values(CART);
            let totalQty = 0;
            let totalAmount = 0;

            const container = document.getElementById('cart-items');
            container.innerHTML = '';
            
            document.getElementById('empty-msg').style.display = items.length === 0 ? 'block' : 'none';

            items.forEach(item => {
                totalQty += item.qty;
                totalAmount += item.price * item.qty;

                const row = document.createElement('div');
                row.className = 'flex gap-3 p-3 bg-white rounded-lg border border-slate-100 relative group transition hover:border-slate-300';
                
                const variantText = item.selectedVariant ? `<span class="text-xs text-slate-500 bg-slate-100 px-2 py-0.5 rounded ml-2">${item.selectedVariant}</span>` : '';

                row.innerHTML = `
                    <div class="w-12 h-12 rounded bg-slate-100 overflow-hidden flex-shrink-0">
                        <img src="${item.image}" class="w-full h-full object-cover">
                    </div>
                    <div class="flex-1 flex flex-col justify-center min-w-0">
                        <h4 class="font-semibold text-sm text-slate-800 truncate">${item.name}</h4>
                        <div class="flex items-center mt-0.5">
                           <span class="text-xs text-slate-500 font-medium">${item.qty} x ${CONFIG.currency}${item.price}</span>
                           ${variantText}
                        </div>
                    </div>
                    <div class="flex items-center">
                        <span class="font-bold text-slate-900 text-sm mr-6">${CONFIG.currency}${(item.price * item.qty).toFixed(2)}</span>
                        <button onclick="removeFromCart('${item.cartKey}')" class="text-slate-300 hover:text-red-500 transition">
                            <i data-lucide="trash-2" class="w-4 h-4"></i>
                        </button>
                    </div>
                `;
                container.appendChild(row);
            });

            const totalFormatted = `${CONFIG.currency}${totalAmount.toFixed(2)}`;
            document.getElementById('sticky-total').textContent = totalFormatted;
            document.getElementById('cart-final-total').textContent = totalFormatted;
            
            const badge = document.getElementById('cart-count');
            badge.textContent = totalQty;
            badge.classList.toggle('scale-0', totalQty === 0);

            const sticky = document.getElementById('sticky-bar');
            if (totalQty > 0) sticky.classList.remove('translate-y-full');
            else sticky.classList.add('translate-y-full');

            lucide.createIcons();
        }

        function removeFromCart(key) {
            delete CART[key];
            updateCartUI();
        }

        function toggleCart() {
            const modal = document.getElementById('cart-modal');
            const panel = document.getElementById('cart-panel');
            
            if (modal.classList.contains('hidden')) {
                modal.classList.remove('hidden');
                setTimeout(() => {
                    modal.classList.remove('opacity-0');
                    panel.classList.remove('translate-x-full');
                }, 10);
                document.body.style.overflow = 'hidden';
            } else {
                modal.classList.add('opacity-0');
                panel.classList.add('translate-x-full');
                setTimeout(() => {
                    modal.classList.add('hidden');
                    document.body.style.overflow = '';
                }, 300);
            }
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            document.getElementById('toast-msg').textContent = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3000);
        }

        function sendWhatsApp() {
            const items = Object.values(CART);
            if (items.length === 0) return;

            const name = document.getElementById('cust-name').value;
            const note = document.getElementById('cust-note').value;
            const phone = document.getElementById('cust-phone').value;
            
            if (!name || !phone) { showToast("❌ Faltan datos de contacto"); return; }

            let text = `*SOLICITUD DE CITA - ${CONFIG.storeName}*\n`;
            text += `👤 ${name}\n`;
            text += `📞 ${phone}\n`;
            if(note) text += `📝 ${note}\n`;
            text += `────────────────────\n`;
            
            let total = 0;
            items.forEach(i => {
                const sub = i.price * i.qty;
                total += sub;
                const v = i.selectedVariant ? ` [${i.selectedVariant}]` : '';
                text += `▪️ ${i.qty}x ${i.name}${v}\n   └ ${CONFIG.currency}${sub}\n`;
            });
            
            text += `────────────────────\n`;
            text += `*TOTAL ESTIMADO: ${CONFIG.currency}${total.toFixed(2)}*`;

            const url = `https://wa.me/${CONFIG.prefix}${CONFIG.phone}?text=${encodeURIComponent(text)}`;
            window.open(url, '_blank');
        }
    </script>
</body>
</html>
